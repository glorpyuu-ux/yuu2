; CYD Chess - ESP32-2432S028 (Cheap Yellow Display)
[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = post:tools/merge_bin.py

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    paulstoffregen/XPT2046_Touchscreen@^1.4

; TFT_eSPI is configured entirely from here, so you never edit User_Setup.h
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    ; Troubleshooting (uncomment ONE if needed):
    ; -DCYD_INVERT_DISPLAY=1        ; colours look like a photo negative
    ; -DTFT_RGB_ORDER=TFT_BGR       ; red and blue are swapped
