# Builds the firmware in the cloud and publishes the browser flasher (web/) to GitHub Pages.
name: Build and publish flasher
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio
      - run: pio run
      - run: test -s web/firmware/cyd-chess-merged.bin
      - uses: actions/upload-artifact@v4
        with:
          name: cyd-chess-merged-bin
          path: web/firmware/cyd-chess-merged.bin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
